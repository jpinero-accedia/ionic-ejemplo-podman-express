services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: dev
    container_name: express_dev_app
    env_file:
      - ./.env
    volumes:
      - express_node_modules:/app/node_modules
      #- express_yarn_cache:/app/.yarn
    ports:
      - "${PORT}:3000"
    develop:
      watch:
        - action: rebuild
          path: ./app/src
          target: ./src
          initial_sync: true
        - action: rebuild
          path: ./app/package.json
          target: ./package.json
          initial_sync: true
        - action: sync
          path: ./app/src/public
          target: ./src/public
          initial_sync: true

volumes:
  express_node_modules:
    name: express_dev_node_modules
#  express_yarn_cache:
 #   name: express_dev_yarn_cache
