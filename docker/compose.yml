services:
  app:
    build:
      context: ./app
      dockerfile: ../Dockerfile
      target: dev
    container_name: express_dev_app
    env_file:
      - ./.env
    volumes:
      - ./app:/app:Z
      - express_node_modules:/app/node_modules
      - express_yarn_cache:/app/.yarn
    ports:
      - "3000:${PORT}"

volumes:
  express_node_modules:
    name: express_dev_node_modules
  express_yarn_cache:
    name: express_dev_yarn_cache
