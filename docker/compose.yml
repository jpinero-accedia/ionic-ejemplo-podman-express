services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: express_dev_app
    volumes:
      - ./app:/app:Z
      - express_node_modules:/app/node_modules
    ports:
      - "3000:3000"

volumes:
  express_node_modules:
    name: express_dev_node_modules
